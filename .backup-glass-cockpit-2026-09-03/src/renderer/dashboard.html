<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline';" />
    <link rel="stylesheet" href="dashboard.css" />
    <title>Rocky OS — Dashboard</title>
  </head>
  <body>
    <header>
      <h1>Rocky OS</h1>
      <span class="subtitle">Tasks, reading, projects, and live Claude sessions — pulled live from the vault</span>
      <button id="refresh" title="Refresh">⟳ Refresh</button>
    </header>

    <main class="board">
      <section class="panel" id="panel-tasks">
        <div class="panel-head">
          <span class="panel-title">Tasks</span>
          <span class="count" id="count-tasks">0</span>
        </div>
        <div class="panel-body" id="list-tasks"></div>
      </section>

      <section class="panel" id="panel-reading">
        <div class="panel-head">
          <span class="panel-title">Reading</span>
          <span class="count" id="count-reading">0</span>
        </div>
        <div class="panel-body" id="list-reading"></div>
      </section>

      <section class="panel" id="panel-projects">
        <div class="panel-head">
          <span class="panel-title">Projects</span>
          <span class="count" id="count-projects">0</span>
        </div>
        <div class="panel-body" id="list-projects"></div>
      </section>

      <section class="panel" id="panel-sessions">
        <div class="panel-head">
          <span class="panel-title">Sessions</span>
          <span class="count" id="count-sessions">0</span>
        </div>
        <div class="panel-body" id="list-sessions"></div>
      </section>
    </main>

    <div id="notes-overlay" class="notes-overlay hidden">
      <div class="notes-panel">
        <div class="notes-head">
          <span id="notes-title">Session notes</span>
          <span class="notes-saved" id="notes-saved"></span>
          <button id="notes-close" title="Close">✕</button>
        </div>
        <textarea id="notes-body" placeholder="Notes for this session — e.g. a 'read in this order' checklist for picking this back up..."></textarea>
      </div>
    </div>

    <script src="dashboard.js"></script>
  </body>
</html>
