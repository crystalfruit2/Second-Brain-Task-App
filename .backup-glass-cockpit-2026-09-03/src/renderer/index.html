<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline';" />
    <link rel="stylesheet" href="styles.css" />
    <title>Notes</title>
  </head>
  <body>
    <header class="drag">
      <div class="tabs no-drag">
        <button class="tab active" id="tab-notes">Notes</button>
        <button class="tab" id="tab-timer">Timer</button>
        <button class="tab" id="tab-article">Article</button>
        <button class="tab" id="tab-tasks">Tasks</button>
      </div>
      <div class="win-btns no-drag">
        <button class="win-btn cig-btn" id="cig-counter" title="Log a cigarette (right-click to undo)">
          🚬 <span id="cig-count">0</span>
        </button>
        <button class="win-btn" id="pin-claude" title="Pin Claude window on top">📌</button>
        <button class="win-btn" id="mission-control" title="Open Mission Control">◎</button>
        <button class="win-btn" id="dashboard" title="Open dashboard">⊞</button>
        <button class="win-btn" id="hide" title="Hide (Esc)">–</button>
        <button class="win-btn quit" id="quit" title="Quit app">×</button>
      </div>
    </header>

    <!-- ============ NOTES VIEW ============ -->
    <main id="view-notes">
      <textarea
        id="input"
        placeholder="Type a note… Enter to send, Shift+Enter for a new line"
        autofocus
      ></textarea>
      <div class="row">
        <span class="hint" id="status"></span>
        <button id="send" class="no-drag">Send ↵</button>
      </div>

      <div class="recent">
        <div class="recent-head">Today</div>
        <ul id="list"></ul>
      </div>
    </main>

    <!-- ============ TIMER VIEW ============ -->
    <main id="view-timer" class="hidden">
      <div class="mode-tabs no-drag">
        <button class="mode-tab active" id="m-focus">Focus</button>
        <button class="mode-tab" id="m-pomo">Pomodoro</button>
      </div>

      <div class="clock" id="clock">00:00</div>
      <div class="clock-label" id="clock-label">Focus</div>
      <div class="dots" id="dots"></div>

      <input
        id="task"
        class="task no-drag"
        placeholder="Working on…"
        autocomplete="off"
      />

      <div class="timer-controls no-drag">
        <button id="main-action" class="primary">Start</button>
        <button id="stop" class="ghost hidden">Stop</button>
      </div>
      <div class="hint center" id="timer-status"></div>
    </main>

    <!-- ============ ARTICLE VIEW ============ -->
    <main id="view-article" class="hidden">
      <input id="a-title" class="a-input" placeholder="Article title" autocomplete="off" />
      <div class="field-row">
        <input id="a-url" class="a-input" placeholder="URL (optional)" autocomplete="off" />
        <input id="a-source" class="a-input" placeholder="Author / source (optional)" autocomplete="off" />
      </div>

      <label class="a-label" for="a-highlights">Highlights <span class="a-hint-inline">verbatim quotes</span></label>
      <textarea id="a-highlights" class="a-textarea" placeholder="Paste the lines worth keeping…"></textarea>

      <label class="a-label" for="a-thoughts">My Thoughts <span class="a-hint-inline">your own words</span></label>
      <textarea id="a-thoughts" class="a-textarea" placeholder="What this means, questions, connections…"></textarea>

      <label class="a-label" for="a-takeaway">Key Takeaway <span class="a-hint-inline">required to save</span></label>
      <input id="a-takeaway" class="a-input" placeholder="One line — the thing worth remembering" autocomplete="off" />

      <div class="row">
        <span class="hint" id="a-status"></span>
        <button id="a-clear" class="ghost no-drag">Clear</button>
        <button id="a-save" class="no-drag">Save to Vault</button>
      </div>
    </main>

    <!-- ============ TASKS VIEW ============ -->
    <!-- Scoped to whichever session is "active" — pick right here, or from the
         Dashboard's Sessions panel, no vault-wide task dump — a short,
         hand-written checklist for what's actually being followed through now. -->
    <main id="view-tasks" class="hidden">
      <div class="row tasks-head">
        <span class="tasks-session-name" id="tasks-session-name">No session selected</span>
        <button id="tasks-refresh" class="ghost no-drag" title="Refresh session list">⟳</button>
      </div>
      <div class="tasks-switcher no-drag" id="tasks-switcher"></div>
      <div class="hint" id="tasks-status">Pick a session above, or from the Dashboard's Sessions panel</div>
      <div class="recent tasks-recent">
        <ul id="tasks-list" class="tasks-list"></ul>
      </div>
    </main>

    <!-- ============ DOCK FOOTER ============ -->
    <footer class="dock-bar no-drag">
      <button class="dock-btn" data-edge="left" title="Dock left">⇤</button>
      <button class="dock-btn" data-edge="top" title="Dock top">⤒</button>
      <button class="dock-btn" data-edge="bottom" title="Dock bottom">⤓</button>
      <button class="dock-btn" data-edge="right" title="Dock right">⇥</button>
      <button class="dock-btn" data-edge="float" title="Float">⧉</button>
    </footer>

    <script src="renderer.js"></script>
  </body>
</html>
