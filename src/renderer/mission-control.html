<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline';" />
    <link rel="stylesheet" href="mission-control.css" />
    <title>Rocky OS — Mission Control</title>
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="brand-name">Rocky OS</span>
        <span class="brand-sub">Mission Control</span>
      </div>
      <div class="today-line" id="today-line"></div>
      <div class="chips" id="chips"></div>
      <button id="refresh" title="Reload every panel">⟳ Refresh</button>
    </header>

    <!-- ============ COMMAND BAR ============ -->
    <section class="command">
      <div class="command-row">
        <span class="command-caret">▸</span>
        <input
          id="cmd"
          class="command-input"
          autocomplete="off"
          spellcheck="false"
          placeholder="Tell Rocky what to do…  ↵ dispatch here  ·  ⌘↵ open in Terminal"
          autofocus
        />
        <button id="cmd-send" class="command-send">Dispatch</button>
      </div>
      <div class="command-foot">
        <div class="quick" id="quick"></div>
        <span class="command-status" id="cmd-status"></span>
      </div>
    </section>

    <main class="grid">
      <!-- ============ STATE COLUMN ============ -->
      <div class="col col-state">
        <section class="panel" id="panel-today">
          <div class="panel-head">
            <span class="panel-title">Today</span>
            <span class="count" id="count-today">—</span>
            <span class="panel-note" id="today-note"></span>
          </div>
          <div class="panel-body">
            <div class="scroll-cap" id="list-today"></div>
            <div class="sub-head">Agenda</div>
            <div id="list-agenda"></div>
          </div>
        </section>

        <section class="panel" id="panel-threads">
          <div class="panel-head">
            <span class="panel-title">Life Threads</span>
            <span class="count" id="count-threads">—</span>
            <span class="panel-note" id="threads-note"></span>
          </div>
          <div class="panel-body">
            <div class="scroll-cap tall" id="list-threads"></div>
          </div>
        </section>

        <div class="triple">
          <section class="panel">
            <div class="panel-head">
              <span class="panel-title">Projects</span>
              <span class="count" id="count-projects">—</span>
            </div>
            <div class="panel-body"><div class="scroll-cap" id="list-projects"></div></div>
          </section>

          <section class="panel">
            <div class="panel-head">
              <span class="panel-title">Inbox</span>
              <span class="count" id="count-inbox">—</span>
            </div>
            <div class="panel-body"><div class="scroll-cap" id="list-inbox"></div></div>
          </section>

          <section class="panel">
            <div class="panel-head">
              <span class="panel-title">Health</span>
              <span class="panel-note" id="health-note"></span>
            </div>
            <div class="panel-body"><div class="scroll-cap" id="list-health"></div></div>
          </section>
        </div>
      </div>

      <!-- ============ AGENT MONITOR ============ -->
      <div class="col col-agent">
        <section class="panel panel-fill">
          <div class="panel-head">
            <span class="panel-title">Agent Monitor</span>
            <span class="count" id="count-agents">—</span>
          </div>
          <div class="panel-body monitor">
            <div class="sub-head first">Rocky jobs</div>
            <div id="list-jobs"></div>
            <div class="sub-head">Terminal sessions</div>
            <div id="list-sessions"></div>
          </div>
        </section>
      </div>
    </main>

    <script src="mission-control.js"></script>
  </body>
</html>
